name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "kilo/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile Python modules
        run: python -m compileall -q main.py mac_finder tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test application imports
        run: python -c "from mac_finder.gui.main_window import MACFinderApp; from mac_finder.inventory import InventoryStore; print('GUI and inventory imports OK')"
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MACFinder --collect-all psutil main.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MACFinder.exe")) { throw "MACFinder.exe was not created" }
          $file = Get-Item "dist/MACFinder.exe"
          if ($file.Length -lt 1000000) { throw "MACFinder.exe is unexpectedly small" }
          Write-Host "Built $($file.FullName) ($($file.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: MACFinder-Windows
          path: dist/MACFinder.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MACFinder.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
